name: Deploy Fontfolio to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Cache bundled open-source fonts
        uses: actions/cache@v4
        with:
          path: public/fonts
          key: ${{ runner.os }}-bundled-fonts-v1-${{ hashFiles('scripts/bundle-fonts.mjs', 'src/data/fonts.ts') }}
      - uses: actions/configure-pages@v5
      - name: Build site
        env:
          GITHUB_PAGES_BASE: /Fontfolio/
          # Optional, explicit license-gated proprietary font publishing.
          # Keep both unset unless you hold web embedding + download rights.
          BLUEAKA_PUBLIC_DISTRIBUTION_AUTHORIZED: ${{ vars.BLUEAKA_PUBLIC_DISTRIBUTION_AUTHORIZED }}
          BLUEAKA_SOURCE_URL: ${{ secrets.BLUEAKA_SOURCE_URL }}
          BLUEAKA_SOURCE_TOKEN: ${{ secrets.BLUEAKA_SOURCE_TOKEN }}
          BLUEAKA_EXPECTED_SHA256: ${{ vars.BLUEAKA_EXPECTED_SHA256 }}
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
